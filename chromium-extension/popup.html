<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Session Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Local Session Bridge</h1>
      <div id="runtimeInfo" class="runtime-info"></div>
    </header>

    <section id="pairSection" class="pair-section">
      <div class="pair-row">
        <input id="pairCode" inputmode="numeric" maxlength="8" placeholder="8 haneli pair code" autocomplete="off">
        <button id="pairButton">Bağla</button>
      </div>
      <div id="pairStatus" class="status"></div>
    </section>

    <section id="siteSection" hidden>
      <div id="sites"></div>
      <div id="siteStatus" class="status"></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
