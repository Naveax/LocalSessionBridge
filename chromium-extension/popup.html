<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Session Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Local Session Bridge</h1>
    <section>
      <h2>Broker eşleştirme</h2>
      <label>Broker URL<input id="brokerUrl" value="http://127.0.0.1:17871"></label>
      <label>Tarayıcı/profil etiketi<input id="profileLabel" placeholder="Brave A / Firefox B"></label>
      <label>8 haneli pair code<input id="pairCode" inputmode="numeric" maxlength="8"></label>
      <button id="pairButton">Eşleştir</button>
      <div id="pairStatus" class="status"></div>
    </section>
    <section>
      <h2>Site ekle</h2>
      <label>Kayıt adı<input id="siteName" placeholder="hubspot-a"></label>
      <label>URL<input id="siteUrl" placeholder="https://example.com/account"></label>
      <label>Cookie store ID (opsiyonel)<input id="storeId"></label>
      <label>Keep-alive URL (aynı origin, opsiyonel)<input id="keepaliveUrl"></label>
      <label>Keep-alive dakika (0=kapalı, min 5)<input id="keepaliveMinutes" type="number" min="0" value="0"></label>
      <button id="addButton">İzin iste ve ekle</button>
      <div id="addStatus" class="status"></div>
    </section>
    <section>
      <div class="row">
        <h2>Kayıtlar</h2>
        <button id="syncAllButton">Tümünü eşitle</button>
      </div>
      <div id="sites"></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
