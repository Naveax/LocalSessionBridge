name: Bootstrap project import

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and authenticate source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          root = Path('.bootstrap')
          files = [root / f'project.zip.b64.part{i:02d}' for i in range(7)]
          assert all(path.is_file() for path in files), 'bootstrap chunk missing'
          chunks = [path.read_bytes() for path in files]
          chunks[1] = (root / 'repair-part01-a').read_bytes() + (root / 'repair-part01-b').read_bytes()
          chunks[3] = (root / 'repair-part03-a').read_bytes() + (root / 'repair-part03-b').read_bytes()

          expected = [
              'fc2799ea7b1cc0aaa8ad5011c20be0de74445515d735306564908bf74db7f10a',
              '1eaa39caef4318b7d957d8b9076d5f9d73dd649a3fdd89db697ac1c26ee30e56',
              '35cdea0191b75de7dc683aa9a7d174500bd41096abaa28e059275c1af0e0cf35',
              '1ca9223c668410b87fa18222f18beeccd0bd70ce548682fe157c484e9f526dcd',
              '5ce2c1d010dd3c9d008feb395a4faa377afd05792ad6951051b10363bb3a174a',
              'f3802bcdfdf4d050c753915a9a5de249f27e01605fd5b1799923616403ba7ab1',
              '952c6368a1f06a2ad5c8c850815d1de8e3f91d2b9d517387fe60ed259841c6d9',
          ]
          for index, (chunk, digest) in enumerate(zip(chunks, expected)):
              actual = hashlib.sha256(chunk).hexdigest()
              assert actual == digest, f'chunk {index:02d}: {actual}'

          encoded = re.sub(rb'[^A-Za-z0-9+/=]', b'', b''.join(chunks))
          archive = base64.b64decode(encoded, validate=True)
          assert len(archive) == 34283, f'unexpected archive size: {len(archive)}'
          digest = hashlib.sha256(archive).hexdigest()
          assert digest == 'f6e588315c86d595f1940df2742a9ee827aa1a1c9ed7629c23f0504f2525d3e3', digest
          Path('/tmp/LocalSessionBridge-source.zip').write_bytes(archive)
          PY
          unzip -t /tmp/LocalSessionBridge-source.zip
          mkdir -p /tmp/ulsb-source
          unzip -q /tmp/LocalSessionBridge-source.zip -d /tmp/ulsb-source
          cp -a /tmp/ulsb-source/. .

      - name: Build and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py
          python broker/session_bridge.py selftest --repeat 10 --report dist/selftest-100.json
          python scripts/verify.py

      - name: Replace bootstrap payload with project source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import LocalSessionBridge v1.0.0 source and release artifacts"
          git push origin HEAD:main
